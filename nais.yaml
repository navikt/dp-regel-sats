name: dp-regel-sats
image: repo.adeo.no:5443/dp-regel-sats
team: teamdagpenger
port: 8097
replicas:
  min: 2
  max: 4
resources:
  limits:
    cpu: 1000m
    memory: 384Mi
  requests:
    cpu: 100m
    memory: 256Mi
prometheus:
  enabled: true
fasitResources:
  used:
    - alias: srvdp-regel-sats
      resourceType: credential
    - alias: dp-regel-sats-properties
      resourceType: applicationproperties